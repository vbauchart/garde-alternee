name: Pages

on:
  push:
    branches: [master]
    paths: ["outil/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site (éditeur seul, sans données)
        run: |
          mkdir _site
          cp outil/core.js _site/
          cp outil/editeur.html _site/index.html
          cp outil/editeur.html _site/editeur.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
