<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning de garde</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1f2328; --muted: #6b7078; --line: #d9dbe0;
    --papa: #9dc3e6; --maman: #f4b183; --vacRef: #ffe699; --vacInd: #d9c8e8; --ferie: #f19c99;
    --accent: #2f6fb0; --warn: #b7791f; --we: #eef0f3; --bon: #2f5a1c; --mauvais: #c0392b;
    --court: #e74c3c; --bandeau: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c; --panel: #1f2228; --ink: #e6e8eb; --muted: #9aa0a8; --line: #343840;
      --papa: #3f6f9c; --maman: #a8673c; --vacRef: #7a6620; --vacInd: #5a4a6e; --ferie: #9c4643;
      --accent: #79a9e0; --warn: #e2b04a; --we: #262a31; --bon: #a9d18e; --mauvais: #ff7b6b;
      --court: #b03a2e; --bandeau: #3a1f1d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  button, select, input { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primaire { background: var(--accent); color: #fff; border-color: var(--accent); }
  select, input[type=text] { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .espace { flex: 1; }
  #source { color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: 300px 1fr; gap: 16px; padding: 16px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { position: static !important; max-height: none !important; } }
  aside { position: sticky; top: 64px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 80px); overflow: auto; }
  .carte { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .carte h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  .totaux { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .total { border-radius: 8px; padding: 8px; text-align: center; }
  .total b { display: block; font-size: 26px; }
  .total.p { background: var(--papa); } .total.m { background: var(--maman); }
  .ligne { display: flex; justify-content: space-between; margin-top: 8px; }
  .barre { height: 8px; border-radius: 4px; overflow: hidden; display: flex; margin-top: 6px; }
  .barre span:first-child { background: var(--papa); } .barre span:last-child { background: var(--maman); }
  table.mois-recap { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  table.mois-recap td { padding: 1px 4px; text-align: right; } table.mois-recap td:first-child { text-align: left; color: var(--muted); }
  .bon { color: var(--bon); font-weight: 600; } .mauvais { color: var(--mauvais); font-weight: 600; }
  .avert { border-left: 3px solid var(--warn); padding: 4px 8px; background: var(--we); border-radius: 3px; font-size: 13px; margin: 0 0 6px; }
  .onglets { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
  .onglets button { border-radius: 6px 6px 0 0; }
  .onglets button.actif { background: var(--accent); color: #fff; border-color: var(--accent); }
  .aide { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .calendrier { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .calendrier.deux { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .mois { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .mois h3 { margin: 0; padding: 5px; text-align: center; background: #404040; color: #fff; font-size: 13px; }
  .mois table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 11px; }
  .mois th { font-weight: 600; color: var(--muted); font-size: 10px; padding: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mois th.groupe { border-left: 2px solid var(--line); }
  .mois td { border-top: 1px solid var(--line); height: 19px; padding: 0 2px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mois td.j { text-align: left; padding-left: 4px; }
  .mois tr.we td.j { background: var(--we); font-weight: 700; }
  .mois td.j.ferie { box-shadow: inset 4px 0 0 var(--ferie); }
  .mois td.debut { border-left: 2px solid var(--line); }
  td.p { background: var(--papa); } td.m { background: var(--maman); }
  td.compte { font-weight: 700; }
  td.court { background: var(--court); color: #fff; }
  .bandeau { border: 1px solid var(--mauvais); border-left-width: 5px; background: var(--bandeau); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; }
  .bandeau b { color: var(--mauvais); }
  .bandeau ul { margin: 4px 0 0; padding-left: 20px; }
  td.vacRef { background: var(--vacRef); } td.vacInd { background: var(--vacInd); }
  .mois th.z, .mois td.z { padding: 0; font-size: 9px; }
  .mois th.z.ref { color: var(--ink); font-weight: 800; }
  .diff::before { content: "•"; color: var(--accent); font-weight: 900; margin-right: 2px; }
  .vide { text-align: center; padding: 50px 20px; border: 2px dashed var(--line); border-radius: 12px; color: var(--muted); max-width: 760px; }
  .vide b { color: var(--ink); }
  .grille-regles { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; max-width: 960px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel); margin: 0; min-width: 0; }
  legend { font-weight: 600; padding: 0 4px; }
  label.champ { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 6px 0; }
  label.champ input[type=text] { min-width: 0; }
  .encart { background: var(--we); color: var(--muted); font-size: 13px; border-radius: 3px; padding: 4px 8px; margin: 0 0 8px; }
  table.blocs { border-collapse: collapse; width: 100%; max-width: 960px; background: var(--panel); margin-top: 8px; font-size: 13px; }
  table.blocs th, table.blocs td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; }
  table.blocs td.P { box-shadow: inset 5px 0 0 var(--papa); padding-left: 10px; }
  table.blocs td.M { box-shadow: inset 5px 0 0 var(--maman); padding-left: 10px; }
  .legende { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .legende i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--line); }
  .actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  h3.section { margin: 18px 0 4px; font-size: 15px; }
  .cache { display: none !important; }
  dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 16px; width: min(420px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0, 0, 0, .4); }
  dialog h2 { font-size: 16px; margin: 0 0 8px; }
  dialog .actions { justify-content: flex-end; }
</style>
</head>
<body>
<header>
  <h1>Planning de garde</h1>
  <label>Année <select id="annee" title="Année affichée (vacances scolaires connues)"></select></label>
  <span id="source"></span>
  <span class="espace"></span>
  <button id="btnImporter" title="Ouvrir une configuration exportée (garde_AAAA.json)">Ouvrir…</button>
  <input type="file" id="fichier" accept=".json,application/json" class="cache">
  <button id="btnExporter" title="Télécharger la configuration des plannings (JSON)">Exporter le JSON</button>
  <button id="btnIcs" title="Exporter les périodes de garde d'un parent vers un agenda (Android, Google Agenda…)">Exporter l'agenda (ICS)…</button>
  <button id="btnPdf" class="primaire">Télécharger le PDF</button>
  <button id="btnReinit" title="Effacer les réglages enregistrés dans ce navigateur et repartir des règles par défaut">Remettre à zéro</button>
</header>

<main>
  <aside id="resume"></aside>

  <section>
    <div id="bandeau" class="bandeau cache"></div>
    <div class="onglets">
      <button data-onglet="calendrier" class="actif">Calendrier</button>
      <button data-onglet="0">Planning 1</button>
      <button data-onglet="1">Planning 2</button>
    </div>

    <div id="onglet-calendrier">
      <div class="legende" id="legende"></div>
      <div id="calendrier" class="calendrier"></div>
    </div>

    <div id="onglet-planning" class="cache"></div>
  </section>
</main>

<dialog id="dlgIcs">
  <form method="dialog">
    <h2>Exporter l'agenda (ICS)</h2>
    <p class="aide">Un événement « Enfants chez … » par période de garde, d'un échange au suivant (heure de Paris).
      À ouvrir sur le téléphone, ou à importer dans Google Agenda (Paramètres › Importer et exporter).</p>
    <label class="champ">Planning <select id="icsPlanning"></select></label>
    <label class="champ">Parent <select id="icsParent"><option value="P">Papa</option><option value="M">Maman</option></select></label>
    <label class="champ">Année <select id="icsAnnee"></select></label>
    <p class="aide" id="icsInfo"></p>
    <div class="actions"><button value="annuler">Annuler</button><button value="ok" class="primaire">Télécharger le .ics</button></div>
  </form>
</dialog>

<script src="core.js"></script>
<script src="impression.js"></script>
<script src="jspdf.umd.min.js"></script>
<script>
"use strict";
const G = window.Garde;
const CLE = "garde-alternee.config.v2";
const FORMAT = "garde-alternee/2";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LMMJVSD = "LMMJVSD";

// ---------------- Calendrier scolaire (data.gouv.fr) ----------------
// Le dernier calendrier téléchargé est gardé dans le navigateur et utilisé dès
// l'ouverture ; il est rafraîchi à chaque chargement. Sans réseau ni cache, le
// calendrier intégré à core.js sert de secours.

const CLE_VACANCES = "garde-alternee.vacances.v1";
const ANNEE_MIN = new Date().getFullYear(); // pas d'années passées dans le choix
let vacancesInjoignables = false;

function vacancesEnCache() {
  try {
    const o = JSON.parse(localStorage.getItem(CLE_VACANCES) || "null");
    if (o) G.chargerVacances(o.lignes, o.date, ANNEE_MIN);
  } catch (e) { /* cache illisible : calendrier intégré */ }
}
async function telechargerVacances() {
  try {
    const opts = typeof AbortSignal.timeout === "function" ? { signal: AbortSignal.timeout(15000) } : {};
    const rep = await fetch(G.urlCalendrierOfficiel(ANNEE_MIN - 1), opts);
    if (!rep.ok) throw new Error(`HTTP ${rep.status}`);
    const lignes = await rep.json(), date = new Date().toISOString().slice(0, 10);
    if (!G.chargerVacances(lignes, date, ANNEE_MIN)) throw new Error("données inutilisables");
    try { localStorage.setItem(CLE_VACANCES, JSON.stringify({ date, lignes })); } catch (e) { /* stockage indisponible */ }
    if (!G.ANNEES.includes(etat.annee)) etat.annee = anneeParDefaut();
    rendre();
  } catch (e) {
    console.warn("Calendrier scolaire data.gouv.fr indisponible :", e.message);
    vacancesInjoignables = true;
    rendre();
  }
}
/** L'année prochaine si elle est connue (on prépare le planning à l'avance), sinon la première connue. */
const anneeParDefaut = () => (G.ANNEES.includes(ANNEE_MIN + 1) ? ANNEE_MIN + 1 : G.ANNEES[0]);
const fmtIso = (iso) => iso.split("-").reverse().join("/");
/** [texte court à côté du sélecteur d'année, infobulle] */
const texteSource = () => (G.SOURCE_VACANCES.type === "data.gouv"
  ? [`data.gouv.fr, ${fmtIso(G.SOURCE_VACANCES.date)}`,
    `Calendrier scolaire officiel téléchargé depuis data.gouv.fr le ${fmtIso(G.SOURCE_VACANCES.date)}, connu jusqu'au ${fmtIso(G.CALENDRIER_CONNU_JUSQUA)}.`]
  : [`calendrier intégré${vacancesInjoignables ? " (hors ligne)" : ""}`,
    `Calendrier scolaire intégré à l'outil, connu jusqu'au ${fmtIso(G.CALENDRIER_CONNU_JUSQUA)}` +
    (vacancesInjoignables ? " : data.gouv.fr injoignable." : " : téléchargement depuis data.gouv.fr en cours…")]);

vacancesEnCache();

// plannings[0] : planning 1 ; plannings[1] : planning 2 (facultatif, variante comparée)
const etat = { annee: anneeParDefaut(), plannings: [G.normaliser(G.PLANNING_DEFAUT)], onglet: "calendrier" };

// ---------------- Stockage ----------------

function sauver() {
  try { localStorage.setItem(CLE, JSON.stringify({ annee: etat.annee, plannings: etat.plannings, onglet: etat.onglet })); }
  catch (e) { /* stockage indisponible : on continue sans */ }
}
function charger(o) {
  if (!o || !Array.isArray(o.plannings) || !o.plannings.length) throw new Error("ce n'est pas une configuration de planning");
  etat.plannings = o.plannings.slice(0, 2).map((p, k) => G.normaliser(Object.assign({ nom: `Planning ${k + 1}` }, p)));
  if (G.ANNEES.includes(+o.annee)) etat.annee = +o.annee;
}
function restaurer() {
  try {
    localStorage.removeItem("garde-alternee.scenarios.v1"); // ancien éditeur (scénarios, jours à éviter)
    const raw = localStorage.getItem(CLE);
    if (!raw) return;
    const o = JSON.parse(raw);
    charger(o);
    if (o.onglet === "calendrier" || (o.onglet === "0") || (o.onglet === "1" && etat.plannings[1])) etat.onglet = o.onglet;
  } catch (e) { /* stockage illisible : règles par défaut */ }
}

// ---------------- Import / export ----------------

function telecharger(nom, objet) {
  const blob = new Blob([JSON.stringify(objet, null, 2) + "\n"], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function importer(f) {
  try { charger(JSON.parse(await f.text())); etat.onglet = "calendrier"; rendre(); sauver(); }
  catch (e) { alert(`${f.name} : ${e.message}`); }
}

// ---------------- Rendu ----------------

const fmtDate = (d) => `${G.JOURS[d.js].slice(0, 3)}. ${d.iso.slice(8)}/${d.iso.slice(5, 7)}${d.iso.slice(0, 4) !== String(etat.annee) ? "/" + d.iso.slice(0, 4) : ""}`;

function rendre() {
  const res = etat.plannings.map((p) => G.calculer(p, etat.annee));
  $("#annee").innerHTML = G.ANNEES.map((a) => `<option value="${a}"${a === etat.annee ? " selected" : ""}>${a}</option>`).join("");
  [$("#source").textContent, $("#source").title] = texteSource();
  document.querySelectorAll(".onglets button").forEach((b) => b.classList.toggle("actif", b.dataset.onglet === etat.onglet));
  $("#onglet-calendrier").classList.toggle("cache", etat.onglet !== "calendrier");
  $("#onglet-planning").classList.toggle("cache", etat.onglet === "calendrier");
  $("#btnPdf").disabled = !(window.jspdf && window.Impression);
  rendreResume(res);
  rendreBandeau(res);
  if (etat.onglet === "calendrier") rendreCalendrier(res);
  else rendrePlanning(+etat.onglet, res[+etat.onglet]);
}

function carteTotaux(p, r, titre) {
  const t = r.total;
  return `<div class="carte">
    <h2>${esc(titre)}</h2>
    <div class="totaux"><div class="total p">Papa<b>${t.P}</b></div><div class="total m">Maman<b>${t.M}</b></div></div>
    <div class="barre"><span style="width:${100 * t.P / (t.P + t.M)}%"></span><span style="flex:1"></span></div>
    <div class="ligne"><span>Écart</span><span class="${t.ecart <= 1 ? "bon" : "mauvais"}">${t.ecart} jour${t.ecart > 1 ? "s" : ""}</span></div>
    <table class="mois-recap"><tr><td></td><td><b>Papa</b></td><td><b>Maman</b></td></tr>
      ${t.mois.map((x, i) => `<tr><td>${G.MOIS[i]}</td><td>${x.P}</td><td>${x.M}</td></tr>`).join("")}</table>
  </div>`;
}

function rendreResume(res) {
  let html = "";
  if (res.some((r) => r.incomplet)) {
    html += `<div class="carte"><p class="avert">Calendrier scolaire officiel connu jusqu'au
      ${G.CALENDRIER_CONNU_JUSQUA.split("-").reverse().join("/")} : les vacances suivantes
      (Toussaint, Noël ${etat.annee}…) ne sont pas encore prises en compte.</p></div>`;
  }
  if (res[1]) {
    const n = res[0].jours.filter((d, k) => d.parent !== res[1].jours[k].parent).length;
    html += `<div class="carte"><h2>Comparaison</h2>
      <div class="ligne" style="margin-top:0"><span>Jours chez un parent différent</span><b>${n}</b></div>
      <div class="ligne"><span>Papa : planning 2 − planning 1</span><b>${res[1].total.P - res[0].total.P > 0 ? "+" : ""}${res[1].total.P - res[0].total.P}</b></div></div>`;
  }
  etat.plannings.forEach((p, k) => { html += carteTotaux(p, res[k], `${p.nom} · ${etat.annee}`); });
  $("#resume").innerHTML = html;
}

function rendreBandeau(res) {
  const el = $("#bandeau");
  const lignes = res.flatMap((r, k) => r.courtes.map((c) => {
    const d = (iso) => fmtDate({ iso, js: G.jourSemaine(G.versJour(iso)) });
    const periode = c.du === c.au ? `le ${d(c.du)}` : `du ${d(c.du)} au ${d(c.au)}`;
    return `<li>${res.length > 1 ? `${esc(etat.plannings[k].nom)} : ` : ""}${G.NOM[c.parent]} ${periode}
      (${c.jours} jour${c.jours > 1 ? "s" : ""})</li>`;
  }));
  el.classList.toggle("cache", !lignes.length);
  el.innerHTML = lignes.length ? `<b>Attention : ${lignes.length} période${lignes.length > 1 ? "s" : ""} de moins de
    ${G.COURT_MIN} jours chez un parent en ${etat.annee}</b> (cases en rouge dans le calendrier).<ul>${lignes.join("")}</ul>` : "";
}

function rendreCalendrier(res) {
  const deux = res.length > 1;
  const refs = new Set(etat.plannings.map((p) => p.zone));
  const vac = Object.fromEntries(G.ZONES.map((z) => [z, G.joursVacances(z, etat.annee)]));
  $("#legende").innerHTML = `<span><i style="background:var(--papa)"></i>Papa</span>
    <span><i style="background:var(--maman)"></i>Maman</span>
    <span><b>fin 18h</b> / <b>dès 18h</b> en gras : parent à qui le jour d'échange est compté</span>
    <span><i style="background:var(--vacRef)"></i>Vacances zone ${[...refs].join(" / ")}</span>
    <span><i style="background:var(--vacInd)"></i>Autres zones (indicatif)</span>
    <span><i style="background:var(--ferie)"></i>Férié</span>
    ${res.some((r) => r.courtes.length) ? `<span><i style="background:var(--court)"></i>Période de moins de ${G.COURT_MIN} jours</span>` : ""}
    ${deux ? `<span><b style="color:var(--accent)">•</b> parent différent entre les plannings 1 et 2</span>` : ""}`;
  $("#calendrier").classList.toggle("deux", deux);

  const cellules = (d) => {
    const e = d.echange, court = (x) => (d.court && d.parent === x ? " court" : "");
    if (!e) return [d.parent === "P" ? ["p" + court("P"), ""] : ["", ""], d.parent === "M" ? ["m" + court("M"), ""] : ["", ""]];
    const txt = { [e.rend]: `fin ${e.heure}`, [e.recoit]: `dès ${e.heure}` };
    return [["p" + (d.parent === "P" ? " compte" : "") + court("P"), txt.P], ["m" + (d.parent === "M" ? " compte" : "") + court("M"), txt.M]];
  };
  let html = "";
  for (let mo = 0; mo < 12; mo++) {
    html += `<div class="mois"><h3>${G.MOIS[mo]}</h3><table><colgroup><col style="width:50px">
      ${res.map(() => "<col><col>").join("")}${G.ZONES.map(() => `<col style="width:13px">`).join("")}</colgroup>`;
    if (deux) html += `<tr><th></th>${etat.plannings.map((p, k) => `<th colspan="2" class="groupe" title="${esc(p.nom)}">${k + 1}. ${esc(p.nom)}</th>`).join("")}<th colspan="3"></th></tr>`;
    html += `<tr><th></th>${res.map(() => `<th class="groupe">Papa</th><th>Maman</th>`).join("")}
      ${G.ZONES.map((z) => `<th class="z${refs.has(z) ? " ref" : ""}" title="Vacances zone ${z}${refs.has(z) ? "" : " (indicatif)"}">${z}</th>`).join("")}</tr>`;
    res[0].jours.forEach((d, k) => {
      if (d.mois !== mo) return;
      const diff = deux && d.parent !== res[1].jours[k].parent;
      html += `<tr class="${d.js >= 5 ? "we" : ""}"><td class="j${d.ferie ? " ferie" : ""}"${d.ferie ? ` title="${esc(d.ferie)}"` : ""}>
        <span class="${diff ? "diff" : ""}">${LMMJVSD[d.js]} ${d.quantieme}</span></td>`;
      for (const r of res) {
        cellules(r.jours[k]).forEach(([cls, txt], c) => { html += `<td class="${cls}${c === 0 ? " debut" : ""}">${txt}</td>`; });
      }
      for (const z of G.ZONES) {
        const nom = vac[z].get(d.iso);
        html += nom ? `<td class="z ${refs.has(z) ? "vacRef" : "vacInd"}" title="${esc(nom)} zone ${z}"></td>` : `<td class="z"></td>`;
      }
      html += `</tr>`;
    });
    html += `</table></div>`;
  }
  $("#calendrier").innerHTML = html;
}

// Effet du partage des vacances pour l'année affichée (le réglage porte sur les années paires).
const parite = (y) => (y % 2 === 0 ? "paire" : "impaire");
const semainePapa = (p, y) => ((y % 2 === 0) === (p.petitesVacancesPapa === 1) ? "1res" : "2es");
const encartPetites = (p, y) => `En ${y} (${parite(y)}), Papa aura les ${semainePapa(p, y)} semaines`;
const encartEte = (p, y) =>
  `En ${y} (${parite(y)}), Papa aura les quinzaines ${(y % 2 === 0) === (p.etePapa === "1-3") ? "1 et 3" : "2 et 4"}`;
const opt = (v, t, sel) => `<option value="${v}"${String(v) === String(sel) ? " selected" : ""}>${t}</option>`;
function champsEchange(cle, r) {
  return `
    <label class="champ">Jour <select data-champ="${cle}.jour">${G.JOURS.map((j) => opt(j, j, r.jour)).join("")}</select></label>
    <label class="champ">Heure <input type="text" data-champ="${cle}.heure" value="${esc(r.heure)}" size="6"></label>
    <label class="champ">Le jour d'échange compte pour <select data-champ="${cle}.compte">
      ${opt("rend", "celui qui rend", r.compte)}${opt("recoit", "celui qui reçoit", r.compte)}</select></label>`;
}

function rendrePlanning(k, r) {
  const el = $("#onglet-planning"), p = etat.plannings[k];
  if (!p) {
    el.innerHTML = `<div class="vide"><p><b>Pas de planning 2.</b><br>
      Le planning 2 est une variante, réglée comme le planning 1 et affichée à côté de lui dans le calendrier pour comparer.</p>
      <p><button id="btnCreer2" class="primaire">Créer le planning 2 (copie du planning 1)</button></p></div>`;
    return;
  }
  const autre = p.semainesPapa === "paires" ? "impaires" : "paires";
  el.innerHTML = `
    <div class="grille-regles" data-k="${k}">
      <fieldset><legend>Planning</legend>
        <label class="champ">Nom <input type="text" data-champ="nom" value="${esc(p.nom)}"></label>
        <label class="champ">Zone de vacances <select data-champ="zone">${G.ZONES.map((z) => opt(z, `Zone ${z}`, p.zone)).join("")}</select></label>
        <p class="aide">Les vacances de cette zone déclenchent l'échange des vacances. Les autres zones sont affichées à titre indicatif.</p>
      </fieldset>
      <fieldset><legend>Hors vacances</legend>
        ${champsEchange("hors", p.hors)}
        <label class="champ">Papa a les semaines <select data-champ="semainesPapa">${opt("paires", "paires", p.semainesPapa)}${opt("impaires", "impaires", p.semainesPapa)}</select></label>
        <p class="aide">Une semaine va d'un échange au suivant ; elle est paire si l'échange qui l'ouvre tombe une semaine ISO de numéro pair.
          Maman a les semaines ${autre}.</p>
      </fieldset>
      <fieldset><legend>Vacances</legend>
        ${champsEchange("vacances", p.vacances)}
        <p class="aide">Les vacances commencent au premier jour d'échange des vacances compris dans les vacances officielles ;
          avant, et après la dernière semaine de vacances, le rythme hors vacances s'applique.</p>
      </fieldset>
      <fieldset><legend>Partage des vacances</legend>
        <label class="champ">Petites vacances : les années paires, Papa a la
          <select data-champ="petitesVacancesPapa">${opt(1, "1re semaine", p.petitesVacancesPapa)}${opt(2, "2e semaine", p.petitesVacancesPapa)}</select></label>
        <p class="encart">${encartPetites(p, etat.annee)}</p>
        <label class="champ">Été : les années paires, Papa a les quinzaines
          <select data-champ="etePapa">${opt("1-3", "1 et 3", p.etePapa)}${opt("2-4", "2 et 4", p.etePapa)}</select></label>
        <p class="encart">${encartEte(p, etat.annee)}</p>
        <p class="aide">C'est l'inverse les années impaires. L'année est celle du début des vacances (Noël 2026-2027 : année paire).
          Toussaint, Noël, hiver et printemps : 2 semaines ; été : jusqu'à 4 quinzaines.</p>
      </fieldset>
    </div>
    ${k === 1 ? `<div class="actions"><button id="btnCopier1">Recopier le planning 1</button><button id="btnSupprimer2">Supprimer le planning 2</button></div>` : ""}
    <h3 class="section">Résumé des règles</h3>
    ${G.texteRegles(p).map((t) => `<p class="aide" style="margin:0 0 4px">${esc(t)}</p>`).join("")}
    <h3 class="section">Vacances ${etat.annee} (zone ${p.zone})</h3>
    <table class="blocs"><thead><tr><th>Vacances</th><th>Bloc</th><th>Du</th><th>Au</th><th>Chez</th></tr></thead><tbody>
      ${r.blocs.map((b) => `<tr><td>${esc(b.vacances)}</td><td>${b.ete ? "quinzaine" : "semaine"} ${b.numero}</td>
        <td>${fmtDate(b.du)} ${b.du.heure}</td><td>${fmtDate(b.au)} ${b.au.heure}</td>
        <td class="${b.parent}">${G.NOM[b.parent]}</td></tr>`).join("")}
    </tbody></table>`;
}

// ---------------- Événements ----------------

document.querySelector(".onglets").addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  etat.onglet = b.dataset.onglet; rendre(); sauver();
});
$("#onglet-planning").addEventListener("change", (ev) => {
  const t = ev.target, champ = t.dataset.champ; if (!champ) return;
  const k = +etat.onglet, p = JSON.parse(JSON.stringify(etat.plannings[k]));
  const [a, b] = champ.split(".");
  if (b) p[a][b] = t.value; else p[a] = t.value;
  etat.plannings[k] = G.normaliser(p);
  rendre(); sauver();
});
$("#onglet-planning").addEventListener("click", (ev) => {
  const id = ev.target.id;
  if (id === "btnCreer2" || id === "btnCopier1") {
    if (id === "btnCopier1" && !confirm("Remplacer les règles du planning 2 par celles du planning 1 ?")) return;
    const nom = etat.plannings[1] ? etat.plannings[1].nom : "Planning 2";
    etat.plannings[1] = G.normaliser(Object.assign({}, etat.plannings[0], { nom }));
  } else if (id === "btnSupprimer2") {
    if (!confirm("Supprimer le planning 2 ?")) return;
    etat.plannings.length = 1; etat.onglet = "calendrier";
  } else return;
  rendre(); sauver();
});
$("#annee").addEventListener("change", (ev) => { etat.annee = +ev.target.value; rendre(); sauver(); });
$("#btnImporter").addEventListener("click", () => $("#fichier").click());
$("#fichier").addEventListener("change", (ev) => { if (ev.target.files[0]) importer(ev.target.files[0]); ev.target.value = ""; });
$("#btnExporter").addEventListener("click", () => telecharger(`garde_${etat.annee}.json`, { format: FORMAT, annee: etat.annee, plannings: etat.plannings }));
$("#btnPdf").addEventListener("click", () => {
  const doc = Impression.documentPDF(etat.plannings, etat.annee);
  Impression.versJsPDF(window.jspdf.jsPDF, doc).save(doc.fichier);
});
function infoIcs() {
  const k = +$("#icsPlanning").value, parent = $("#icsParent").value, annee = +$("#icsAnnee").value;
  const n = G.periodes(etat.plannings[k], annee, parent).length;
  $("#icsInfo").textContent = `${n} période${n > 1 ? "s" : ""} chez ${G.NOM[parent]} en ${annee}.` +
    (G.calculer(etat.plannings[k], annee).incomplet ? " Vacances connues jusqu'au " +
      G.CALENDRIER_CONNU_JUSQUA.split("-").reverse().join("/") + " seulement." : "");
}
$("#btnIcs").addEventListener("click", () => {
  const k = $("#icsPlanning").value;
  $("#icsPlanning").innerHTML = etat.plannings.map((p, i) => opt(i, `${i + 1}. ${esc(p.nom)}`, k || 0)).join("");
  $("#icsAnnee").innerHTML = G.ANNEES.map((a) => opt(a, a, etat.annee)).join("");
  infoIcs();
  $("#dlgIcs").showModal();
});
["#icsPlanning", "#icsParent", "#icsAnnee"].forEach((s) => $(s).addEventListener("change", infoIcs));
$("#dlgIcs").addEventListener("close", () => {
  if ($("#dlgIcs").returnValue !== "ok") return;
  const p = etat.plannings[+$("#icsPlanning").value], parent = $("#icsParent").value, annee = +$("#icsAnnee").value;
  const blob = new Blob([G.icalendar(p, annee, parent)], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `garde_${G.NOM[parent].toLowerCase()}_${annee}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$("#btnReinit").addEventListener("click", () => {
  if (!confirm("Remettre à zéro ? Les règles enregistrées dans ce navigateur seront effacées.")) return;
  try { localStorage.removeItem(CLE); } catch (e) { /* stockage indisponible */ }
  location.reload();
});
window.addEventListener("dragover", (ev) => ev.preventDefault());
window.addEventListener("drop", (ev) => { ev.preventDefault(); const f = [...ev.dataTransfer.files].find((x) => x.name.endsWith(".json")); if (f) importer(f); });

restaurer();
rendre();
telechargerVacances();
</script>
</body>
</html>
